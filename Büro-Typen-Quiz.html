<style>
  /* Layout: single column. Questions one at a time, result shown as a Dienstausweis (staff ID card).
     Palette: Aktenordner-Blau as the one accent, Haftnotiz-Gelb only for the motto note. */
  :root {
    --bg: #f2f4f8;
    --surface: #ffffff;
    --fg: #14181f;
    --muted: #566072;
    --line: #d9dee8;
    --accent: #2447a8;
    --accent-fg: #ffffff;
    --accent-soft: #e4eafa;
    --note: #fff1a8;
    --note-fg: #4a3d00;
    --font-display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b;
      --surface: #1b2029;
      --fg: #eaedf3;
      --muted: #9aa3b5;
      --line: #2c3342;
      --accent: #8fb0ff;
      --accent-fg: #0c1630;
      --accent-soft: #1e2a47;
      --note: #5a4a10;
      --note-fg: #ffe9a0;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b;
    --surface: #1b2029;
    --fg: #eaedf3;
    --muted: #9aa3b5;
    --line: #2c3342;
    --accent: #8fb0ff;
    --accent-fg: #0c1630;
    --accent-soft: #1e2a47;
    --note: #5a4a10;
    --note-fg: #ffe9a0;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.55;
    padding-block: 28px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

  header { display: flex; flex-direction: column; gap: 6px; }
  .kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  h1 { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.15; margin: 0; text-wrap: balance; }
  .sub { color: var(--muted); margin: 0; font-size: 15px; }

  .progress { display: flex; flex-direction: column; gap: 8px; }
  .progress-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--accent); transition: width .3s ease; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .q { font-family: var(--font-display); font-weight: 500; font-size: 21px; line-height: 1.3; margin: 0; text-wrap: balance; }
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
    font: inherit; color: var(--fg); background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; min-width: 0;
  }
  .opt:hover { border-color: var(--accent); }
  .opt.sel { border-color: var(--accent); background: var(--accent-soft); }
  .opt:focus-visible, .btn:focus-visible, .link:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .letter {
    flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
    font-size: 13px; font-weight: 600; background: var(--accent-soft); color: var(--accent);
  }
  .opt.sel .letter { background: var(--accent); color: var(--accent-fg); }
  .opt-text { min-width: 0; overflow-wrap: anywhere; }

  .nav { display: flex; justify-content: space-between; align-items: center; min-height: 24px; }
  .link { font: inherit; font-size: 14px; background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; cursor: pointer; }
  .link[hidden] { display: none; }

  .btn { font: inherit; font-weight: 600; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 12px 22px; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

  /* Dienstausweis */
  .id { background: var(--surface); border: 1.5px solid var(--accent); border-radius: 14px; overflow: hidden; min-width: 0; }
  .id-top {
    background: var(--accent); color: var(--accent-fg); padding: 10px 20px;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600;
  }
  .id-body { padding: 22px 20px; display: flex; flex-direction: column; gap: 18px; }
  .id-head { display: flex; gap: 16px; align-items: center; min-width: 0; }
  .art { display: block; width: 100%; height: auto; }
  .id-label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .id-name { font-family: var(--font-display); font-weight: 700; font-size: 28px; line-height: 1.12; margin: 2px 0 0; text-wrap: balance; overflow-wrap: anywhere; }
  .motto { background: var(--note); color: var(--note-fg); border-radius: 6px; padding: 10px 14px; font-weight: 600; margin: 0; }
  .desc { margin: 0; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; margin: 0; }
  .facts div { min-width: 0; }
  .facts dt { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .facts dd { margin: 2px 0 0; overflow-wrap: anywhere; }
  .facts .wide { grid-column: 1 / -1; }

  .scores { display: flex; flex-direction: column; gap: 10px; }
  .scores h3, .all h3 { font-family: var(--font-display); font-size: 16px; margin: 0; }
  .srow { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 6px 12px; align-items: center; font-size: 14px; }
  .srow .sname { grid-column: 1 / -1; }
  .sbar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
  .sbar span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .spts { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }

  details { border-top: 1px solid var(--line); padding-top: 14px; }
  summary { cursor: pointer; font-weight: 600; color: var(--accent); }
  .alllist { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; }
  .alllist li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; min-width: 0; }
  .alllist li:first-child { border-top: 0; }
  .alllist b { display: block; font-weight: 600; }
  .alllist span { color: var(--muted); overflow-wrap: anywhere; }

  .status { font-size: 14px; color: var(--muted); margin: 0; min-height: 21px; }
  .note { font-size: 13px; color: var(--muted); margin: 0; }

  @media (max-width: 480px) {
    .card { padding: 18px; }
    h1 { font-size: 24px; }
    .q { font-size: 19px; }
    .id-name { font-size: 24px; }
    .facts { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
</style>

<div class="wrap">

    <h1>Büro-Typen-Quiz</h1>

  <main id="app"></main>

  <p class="note">Nur zum Spaß und nicht wissenschaftlich. Die Typen sind für alle gedacht, egal ob Kollege oder Kollegin.</p>

      back: '<g stroke="none"><circle cx="30" cy="30" r="3" fill="var(--accent)"/><rect x="52" y="48" width="6" height="6" fill="var(--note)" transform="rotate(20 55 51)"/><circle cx="72" cy="22" r="2.5" fill="var(--fg)"/><rect x="196" y="60" width="6" height="6" fill="var(--accent)" transform="rotate(-15 199 63)"/><circle cx="214" cy="76" r="3" fill="var(--note)"/><circle cx="100" cy="20" r="2.5" fill="var(--accent)"/><rect x="150" y="68" width="6" height="6" fill="var(--fg)" transform="rotate(30 153 71)"/></g>' +
        '<path d="M0 10c20 14 30-6 50 8s28 0 40 6M240 8c-20 14-30-6-50 8s-28 0-30 4" stroke="var(--accent)"/>' +
        bubble(146, 30, 88, 24, 'Kennt ihr den?', 9) +
        '<ellipse cx="44" cy="66" rx="12" ry="15" fill="var(--accent)"/><path d="M44 81c-3 6 3 10 0 16"/>',
      head: '<path d="M106 46L120 14l14 32z" fill="var(--accent)"/><path d="M110 38h20M114 28h12" stroke="var(--surface)" stroke-width="2"/><circle cx="120" cy="13" r="4" fill="var(--note)"/>',
      front: '<rect x="168" y="90" width="40" height="14" rx="3" fill="var(--surface)"/><rect x="174" y="76" width="28" height="14" rx="3" fill="var(--note)"/><path d="M188 76v-8"/><path d="M188 60c-3 4-3 6 0 6s3-2 0-6z" fill="var(--accent)"/>' }
  };

  function artSvg(key, t) {
    var a = ART[key];
    var s = '<svg class="art" viewBox="0 0 240 160" role="img" aria-label="Illustration: ' + esc(youAre(key, t)) + '">';
    s += '<rect width="240" height="160" fill="var(--accent-soft)"/>';
    s += '<g fill="none" stroke="var(--fg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">';
    s += '<path d="M0 148H240" stroke="var(--line)" stroke-width="2"/>';
    s += (a.back || "");
    s += '<rect x="94" y="77" width="52" height="29" rx="14" fill="var(--accent)"/>';
    s += (a.arms || "");
    s += '<circle cx="120" cy="60" r="17" fill="var(--surface)"/>';
    s += EYES[a.e || "n"] + MOUTH[a.m || "s"] + (a.head || "");
    s += '<rect x="12" y="104" width="216" height="9" rx="2" fill="var(--surface)"/><path d="M28 113V148M212 113V148"/>';
    s += (a.front || "");
    s += '</g></svg>';
    return s;
  }

  var state = { i: 0, answers: [] };
  var app = document.getElementById("app");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; });
  }
  function setProgress(done) {
    var n = QS.length;
    var shown = done ? n : state.i;
    document.getElementById("pos").textContent = done ? "Fertig" : "Frage " + (state.i + 1) + " von " + n;
    document.getElementById("pct").textContent = Math.round(shown / n * 100) + " %";
    document.getElementById("fill").style.width = (shown / n * 100) + "%";
  }

  function renderQuestion() {
    var item = QS[state.i];
    var chosen = state.answers[state.i];
    var html = '<section class="card" aria-labelledby="qtext"><h2 class="q" id="qtext" tabindex="-1">' + esc(item.q) + '</h2>';
    html += '<div class="opts" role="group" aria-label="Antworten">';
    item.o.forEach(function (o, k) {
      html += '<button type="button" class="opt' + (chosen === k ? " sel" : "") + '" data-k="' + k + '">' +
        '<span class="letter">' + LETTERS[k] + '</span><span class="opt-text">' + esc(o.t) + '</span></button>';
    });
    html += '</div><div class="nav"><button type="button" class="link" id="backBtn"' + (state.i === 0 ? " hidden" : "") + '>Zurück</button></div></section>';
    app.innerHTML = html;
    setProgress(false);

    Array.prototype.forEach.call(app.querySelectorAll(".opt"), function (b) {
      b.addEventListener("click", function () {
        state.answers[state.i] = Number(b.getAttribute("data-k"));
        state.i++;
        if (state.i >= QS.length) renderResult();
        else { renderQuestion(); document.getElementById("qtext").focus(); }
      });
    });
    document.getElementById("backBtn").addEventListener("click", function () {
      if (state.i > 0) { state.i--; renderQuestion(); document.getElementById("qtext").focus(); }
    });
  }

  function compute() {
    var score = {}, prim = {};
    ORDER.forEach(function (k) { score[k] = 0; prim[k] = 0; });
    QS.forEach(function (q, i) {
      var o = q.o[state.answers[i]];
      score[o.p] += 2; prim[o.p] += 1; score[o.s] += 1;
    });
    var ranked = ORDER.slice().sort(function (a, b) {
      if (score[b] !== score[a]) return score[b] - score[a];
      if (prim[b] !== prim[a]) return prim[b] - prim[a];
      return ORDER.indexOf(a) - ORDER.indexOf(b);
    });
    return { score: score, ranked: ranked };
  }

  var lastText = "";
  function renderResult() {
    var r = compute();
    var key = r.ranked[0], t = TYPES[key];
    var partner = TYPES[t.pa];
    var nr = ("0" + (ORDER.indexOf(key) + 1)).slice(-2);
    var top = r.score[key];
    lastText = "Ich bin " + youAre(key, t) + ". " + t.motto + " (Büro-Typen-Quiz)";

    var html = '<section class="card" aria-labelledby="rtitle">';
    html += '<div class="id"><div class="id-top"><span>Dienstausweis Büro-Persönlichkeit</span><span>Ausweis-Nr. ' + nr + '</span></div>';
    html += artSvg(key, t);
    html += '<div class="id-body"><div class="id-head"><div><div class="id-label">Dein Ergebnis</div><h2 class="id-name" id="rtitle" tabindex="-1">Du bist ' + esc(youAre(key, t)) + '</h2></div></div>';
    html += '<p class="motto">' + esc(t.motto) + '</p>';
    html += '<p class="desc">' + esc(t.d) + '</p>';
    html += '<dl class="facts"><div><dt>Stärke</dt><dd>' + esc(t.st) + '</dd></div><div><dt>Schwäche</dt><dd>' + esc(t.sw) + '</dd></div>' +
      '<div class="wide"><dt>Lieblingssatz</dt><dd>„' + esc(t.ln) + '“</dd></div>' +
      '<div class="wide"><dt>Arbeitet am besten zusammen mit</dt><dd>' + esc(partner.n) + '</dd></div></dl>';
    html += '</div></div>';

    html += '<div class="scores"><h3>Deine drei stärksten Typen</h3>';
    r.ranked.slice(0, 3).forEach(function (k) {
      var pts = r.score[k];
      html += '<div class="srow"><span class="sname">' + esc(TYPES[k].n) + '</span><div class="sbar"><span style="width:' + Math.round(pts / top * 100) + '%"></span></div><span class="spts">' + pts + ' P.</span></div>';
    });
    html += '</div>';

    html += '<div class="btn-row"><button type="button" class="btn" id="copyBtn">Ergebnis kopieren</button>' +
      '<button type="button" class="btn ghost" id="againBtn">Noch einmal</button></div>';
    html += '<p class="status" id="status" role="status"></p>';

    html += '<details class="all"><summary>Alle 16 Büro-Typen ansehen</summary><ul class="alllist">';
    ORDER.forEach(function (k) {
      html += '<li><b>' + esc(TYPES[k].n) + '</b><span>' + esc(TYPES[k].motto) + '</span></li>';
    });
    html += '</ul></details></section>';

    app.innerHTML = html;
    setProgress(true);
    document.getElementById("rtitle").focus();

    document.getElementById("againBtn").addEventListener("click", function () {
      state = { i: 0, answers: [] };
      renderQuestion();
      window.scrollTo(0, 0);
    });
    document.getElementById("copyBtn").addEventListener("click", function () {
      var st = document.getElementById("status");
      try {
        navigator.clipboard.writeText(lastText).then(function () {
          st.textContent = "Kopiert.";
        }, function () {
          st.textContent = "Kopieren ist hier nicht möglich. Markiere den Text stattdessen von Hand.";
        });
      } catch (e) {
        st.textContent = "Kopieren ist hier nicht möglich. Markiere den Text stattdessen von Hand.";
      }
    });
  }

  renderQuestion();
</script>

</body></html>
